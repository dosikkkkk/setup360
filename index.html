<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>360 Tour</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background-color: #000;
        font-family: 'Arial', sans-serif;
        touch-action: none;
    }

    #viewer {
        position: absolute; inset: 0;
    }

    .label {
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        color: white; background: rgba(0,0,0,0.6); padding: 10px 30px;
        border-radius: 40px; font-weight: bold; z-index: 100;
        text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2);
        pointer-events: none;
    }

    #menu {
        position: absolute; bottom: 20px; left: 50%;
        transform: translateX(-50%); display: flex;
        gap: 12px; z-index: 999; padding: 10px 20px;
        background: rgba(0, 0, 0, 0.85); border-radius: 50px;
        overflow-x: auto; max-width: 90vw;
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        padding-bottom: 12px;
    }

    #menu::-webkit-scrollbar { height: 7px; }
    #menu::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin: 0 25px;
    }
    #menu::-webkit-scrollbar-thumb {
        background: #1976D2;
        border-radius: 10px;
    }

    #menu button {
        cursor: pointer;
        white-space: nowrap; color: white;
        font-weight: bold; font-size: 13px; padding: 10px 22px;
        background: rgba(255,255,255,0.1); border-radius: 25px;
        border: 1px solid transparent; transition: all 0.3s;
    }
    #menu button:hover { background: rgba(255,255,255,0.2); }
    #menu button.active { background: #1976D2; border-color: #fff; }

    /* ---- Экран загрузки pannellum: убираем текст с процентами/МБ,
       оставляем только чистую полоску прогресса в цветах меню ---- */
    .pnlm-lmsg,
    .pnlm-lbox-icon {
        display: none !important;
    }
    .pnlm-load-box {
        background: transparent !important;
        box-shadow: none !important;
        width: auto !important;
    }
    .pnlm-lbar-container {
        width: 220px !important;
    }
    .pnlm-lbar {
        height: 4px !important;
        background: rgba(255,255,255,0.15) !important;
        border-radius: 4px !important;
        overflow: hidden;
        border: none !important;
    }
    .pnlm-lbar-fill {
        background: #1976D2 !important;
    }

    /* Полностью скрываем всплывающее окно "Pannellum x.x.x" по ПКМ */
    .pnlm-about-msg {
        display: none !important;
    }

    .pnlm-title-box {
        display: none !important;
    }
</style>
</head>
<body>

<div class="label" id="t">HALL</div>

<div id="viewer"></div>

<div id="menu"></div>

<script>
const scenes = {
    hall:       { title: "Hall",        panorama: "hall.jpeg",       yaw: 116, pitch: 0 },
    conference: { title: "Conference",  panorama: "konference.jpeg", yaw: 0, pitch: 0 },
    vip1:       { title: "VIP 1",       panorama: "vip4.jpeg",       yaw: -169, pitch: -19 },
    vip2:       { title: "VIP 2",       panorama: "vip2.jpeg",       yaw: 0, pitch: 0 },
    vip3:       { title: "VIP 3",       panorama: "vip3.jpeg",       yaw: 28, pitch: -18 },
    vip4:       { title: "VIP 4",       panorama: "vip1.jpeg",       yaw: 12, pitch: -1 },
    tokyo:      { title: "Tokyo",       panorama: "tokyo.jpeg",      yaw: 154, pitch: -15 },
    paris:      { title: "Paris",       panorama: "paris.jpeg",      yaw: 128, pitch: -16 }
};

// На ПК ставим больший угол обзора (немного отдалено),
// на телефоне оставляем стандартный — там и так нормально видно
const isDesktop = window.innerWidth > 768;
const defaultHfov = isDesktop ? 115 : 100;
const maxHfov = isDesktop ? 130 : 120;

// Сразу грузим первую сцену при открытии страницы
const viewer = pannellum.viewer('viewer', {
    default: {
        firstScene: 'hall',
        sceneFadeDuration: 800,
        autoLoad: true,
        hfov: defaultHfov,
        maxHfov: maxHfov
    },
    scenes: scenes
});

const menu = document.getElementById('menu');
const t = document.getElementById('t');

// Отключаем всплывающую подсказку pannellum по правому клику
// (capture:true — чтобы сработать раньше собственного обработчика pannellum)
document.getElementById('viewer').addEventListener('contextmenu', e => {
    e.preventDefault();
    e.stopPropagation();
}, true);

function setActive(btn) {
    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

for (const key in scenes) {
    const btn = document.createElement('button');
    btn.textContent = scenes[key].title;
    if (key === 'hall') btn.classList.add('active');
    btn.onclick = () => {
        viewer.loadScene(key);
        t.textContent = scenes[key].title.toUpperCase();
        setActive(btn);
    };
    menu.appendChild(btn);
}
</script>
</body>
</html>
